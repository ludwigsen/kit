<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kit / SQL Formatter</title>
  <link rel="stylesheet" href="../../assets/style.css">
  <link rel="stylesheet" href="./sql-formatter.css">
</head>
<body>

  <main class="main">
    <div class="shell">

      <div class="toolbar">
        <div class="toolbar-group">
          <label class="toolbar-label">Dialect</label>
          <div class="seg" id="dialect-seg">
            <button class="seg-btn active" data-value="tsql">T-SQL</button>
            <button class="seg-btn" data-value="sql">SQL</button>
            <button class="seg-btn" data-value="mysql">MySQL</button>
            <button class="seg-btn" data-value="postgresql">PostgreSQL</button>
          </div>
        </div>

        <div class="toolbar-group">
          <label class="toolbar-label">Keywords</label>
          <div class="seg" id="case-seg">
            <button class="seg-btn active" data-value="lower">lower</button>
            <button class="seg-btn" data-value="upper">UPPER</button>
            <button class="seg-btn" data-value="preserve">preserve</button>
          </div>
        </div>

        <div class="toolbar-group">
          <label class="toolbar-label">Indent</label>
          <div class="seg" id="indent-seg">
            <button class="seg-btn active" data-value="2">2</button>
            <button class="seg-btn" data-value="4">4</button>
            <button class="seg-btn" data-value="tab">tab</button>
          </div>
        </div>

        <div class="toolbar-actions">
          <button class="btn-ghost" id="btn-clear" title="Clear input">
            <i data-lucide="x" width="14" height="14"></i>
            Clear
          </button>
          <button class="btn-primary" id="btn-format">
            <i data-lucide="wand-2" width="14" height="14"></i>
            Format
          </button>
        </div>
      </div>

      <div class="editor-grid">
        <div class="editor-pane">
          <div class="pane-header">
            <span class="pane-label">Input</span>
            <span class="pane-hint">Paste your SQL here</span>
          </div>
          <textarea id="input" class="code-area" placeholder="select * from USR_CONSTITUENTINTEREST where CONSTITUENTID = @id and ISACTIVE = 1" spellcheck="false"></textarea>
        </div>

        <div class="editor-pane">
          <div class="pane-header">
            <span class="pane-label">Output</span>
            <div class="pane-actions">
              <span class="status-msg" id="status-msg"></span>
              <button class="btn-ghost btn-sm" id="btn-copy" disabled>
                <i data-lucide="copy" width="13" height="13"></i>
                Copy
              </button>
            </div>
          </div>
          <textarea id="output" class="code-area" readonly placeholder="Formatted SQL will appear here…" spellcheck="false"></textarea>
        </div>
      </div>

    </div>
  </main>

  <!-- order matters: header/footer load first, then lucide, then tool js file(s) -->
  <script src="../../assets/hf.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/sql-formatter@15.4.9/dist/sql-formatter.min.js"></script>
  <script>document.addEventListener('DOMContentLoaded', () => lucide.createIcons());</script>
  <script src="./sql-formatter.js"></script>
</body>
</html>
